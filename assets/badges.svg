<svg xmlns="http://www.w3.org/2000/svg" width="838" height="28" viewBox="0 0 838 28" role="img" aria-label="STATUS ONLINE - FOCUS rotating - MODE LOCAL FIRST - BUILD STABLE">
  <title>sixpencecn // system status</title>
  <defs>
    <clipPath id="focusClip"><rect x="248" y="0" width="222" height="28" rx="4"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="bold" letter-spacing="0.6">
    <!-- STATUS : ONLINE -->
    <rect x="0" y="0" width="162" height="28" rx="4" fill="#22d3ee"/>
    <rect x="0" y="0" width="78" height="28" rx="4" fill="#161b26"/>
    <rect x="73" y="0" width="5" height="28" fill="#161b26"/>
    <text x="39" y="18.5" text-anchor="middle" fill="#e8f6ff">STATUS</text>
    <text x="120" y="18.5" text-anchor="middle" fill="#071018">ONLINE</text>

    <!-- FOCUS : rotating -->
    <rect x="170" y="0" width="300" height="28" rx="4" fill="#ff4d9d"/>
    <rect x="170" y="0" width="78" height="28" rx="4" fill="#161b26"/>
    <rect x="243" y="0" width="5" height="28" fill="#161b26"/>
    <text x="209" y="18.5" text-anchor="middle" fill="#e8f6ff">FOCUS</text>
    <g clip-path="url(#focusClip)" fill="#14060f" text-anchor="middle">
      <text x="359" y="18.5">COMPUTER VISION
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.25;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="359" y="18.5">LLM APPLICATIONS
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="359" y="18.5">DEV TOOLING
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="359" y="18.5">EVALUATION FIRST
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.98;0.99;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="248" y="0" width="90" height="28" fill="url(#shine)" clip-path="url(#focusClip)">
      <animateTransform attributeName="transform" type="translate" from="-100 0" to="230 0" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- MODE : LOCAL FIRST -->
    <rect x="478" y="0" width="200" height="28" rx="4" fill="#22d3ee"/>
    <rect x="478" y="0" width="64" height="28" rx="4" fill="#161b26"/>
    <rect x="537" y="0" width="5" height="28" fill="#161b26"/>
    <text x="510" y="18.5" text-anchor="middle" fill="#e8f6ff">MODE</text>
    <text x="578" y="18.5" text-anchor="middle" fill="#071018">LOCAL FIRST</text>

    <!-- BUILD : STABLE -->
    <rect x="686" y="0" width="152" height="28" rx="4" fill="#b99aff"/>
    <rect x="686" y="0" width="64" height="28" rx="4" fill="#161b26"/>
    <rect x="745" y="0" width="5" height="28" fill="#161b26"/>
    <text x="718" y="18.5" text-anchor="middle" fill="#e8f6ff">BUILD</text>
    <text x="762" y="18.5" text-anchor="middle" fill="#150a24">STABLE</text>
  </g>
</svg>
