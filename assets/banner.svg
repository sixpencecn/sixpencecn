<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="sixpencecn — AI engineer building LLM applications and agent systems">
  <title>sixpencecn — AI Engineer, LLM Applications &amp; Agent Systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#0E1526"/>
      <stop offset="100%" stop-color="#131C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#2F81F7" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1090" cy="70" r="240" fill="url(#glow)"/>

  <!-- agent graph motif -->
  <g stroke="url(#accent)" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M905 108 L1005 78 L1092 140 L1030 214 L922 196 Z"/>
    <path d="M1005 78 L1030 214"/>
    <path d="M905 108 L1030 214"/>
    <path d="M1092 140 L922 196"/>
  </g>
  <g fill="#0B1020" stroke="url(#accent)" stroke-width="2">
    <circle cx="905" cy="108" r="7"/>
    <circle cx="1005" cy="78" r="7"/>
    <circle cx="1092" cy="140" r="7"/>
    <circle cx="1030" cy="214" r="7"/>
    <circle cx="922" cy="196" r="7"/>
  </g>
  <g fill="#22D3EE" opacity="0.9">
    <circle cx="1005" cy="78" r="2.6"/>
    <circle cx="1092" cy="140" r="2.6"/>
    <circle cx="922" cy="196" r="2.6"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#F0F6FC" letter-spacing="-1">sixpencecn</text>
  <rect x="82" y="172" width="92" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="214" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#93A1BA">AI Engineer · LLM Applications &amp; Agent Systems</text>
  <text x="80" y="252" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5C6A85" letter-spacing="1.6">EVALUATION-FIRST · RETRIEVAL-GROUNDED · PRODUCTION-MINDED</text>
</svg>
