<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Qingxu workbench — local-first personal dashboard with calendar, todos, focus timer and finance">
  <title>Qingxu (轻序) — personal workbench dashboard</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79c9b4"/>
      <stop offset="100%" stop-color="#2f9e7d"/>
    </linearGradient>
    <clipPath id="win"><rect width="1200" height="700" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
    <rect width="1200" height="700" fill="#f6faf8"/>

    <!-- sidebar -->
    <rect x="0" y="0" width="230" height="700" fill="#ffffff"/>
    <line x1="230" y1="0" x2="230" y2="700" stroke="#e5efea" stroke-width="1"/>

    <rect x="22" y="24" width="36" height="36" rx="12" fill="url(#brand)"/>
    <rect x="31" y="46" width="4" height="9" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="38" y="40" width="4" height="15" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="45" y="43" width="4" height="12" rx="2" fill="#ffffff" opacity="0.85"/>
    <text x="70" y="44" font-size="17" font-weight="700" fill="#1f322c" letter-spacing="1">轻序</text>
    <text x="70" y="61" font-size="11" fill="#8aa098">个人管理工作台</text>

    <text x="34" y="112" font-size="11" fill="#8aa098" letter-spacing="2">工作台</text>
    <g font-size="13.5" fill="#526960">
      <rect x="16" y="126" width="198" height="38" rx="11" fill="#e4f4ee"/>
      <circle cx="36" cy="145" r="5" fill="#2f9e7d"/>
      <text x="52" y="150" fill="#247e63" font-weight="600">概览</text>

      <circle cx="36" cy="187" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="192">日程</text>
      <circle cx="36" cy="229" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="234">待办</text>
      <circle cx="36" cy="271" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="276">专注</text>
      <circle cx="36" cy="313" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="318">记账</text>
      <circle cx="36" cy="355" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="360">习惯打卡</text>
      <circle cx="36" cy="397" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="402">相册日记</text>
      <circle cx="36" cy="439" r="5" fill="none" stroke="#8aa098" stroke-width="1.6"/>
      <text x="52" y="444">灵感</text>
    </g>

    <line x1="28" y1="480" x2="202" y2="480" stroke="#e5efea"/>
    <text x="34" y="504" font-size="11" fill="#8aa098">数据仅保存在本机浏览器</text>
    <text x="34" y="524" font-size="11" fill="#8aa098">离线可用 · 可安装</text>

    <!-- topbar -->
    <text x="262" y="44" font-size="22" font-weight="700" fill="#1f322c">概览</text>
    <text x="262" y="64" font-size="12" fill="#8aa098">把今天过得更有序</text>
    <rect x="972" y="24" width="150" height="30" rx="15" fill="#ffffff" stroke="#e5efea"/>
    <text x="988" y="43" font-size="11.5" fill="#526960">2026年11月23日 周一</text>
    <rect x="1134" y="24" width="30" height="30" rx="9" fill="#ffffff" stroke="#e5efea"/>

    <!-- stat cards -->
    <g>
      <rect x="262" y="90" width="216" height="98" rx="16" fill="#ffffff" stroke="#e5efea"/>
      <text x="280" y="116" font-size="12" fill="#8aa098">今日待办</text>
      <text x="280" y="152" font-size="26" font-weight="700" fill="#2f9e7d">5<tspan font-size="13" fill="#8aa098"> / 8</tspan></text>
      <text x="280" y="174" font-size="11" fill="#8aa098">还有 3 项待完成</text>

      <rect x="490" y="90" width="216" height="98" rx="16" fill="#ffffff" stroke="#e5efea"/>
      <text x="508" y="116" font-size="12" fill="#8aa098">专注时长</text>
      <text x="508" y="152" font-size="26" font-weight="700" fill="#5b95cf">96<tspan font-size="13" fill="#8aa098"> 分钟</tspan></text>
      <text x="508" y="174" font-size="11" fill="#8aa098">已完成 4 个番茄钟</text>

      <rect x="718" y="90" width="216" height="98" rx="16" fill="#ffffff" stroke="#e5efea"/>
      <text x="736" y="116" font-size="12" fill="#8aa098">连续打卡</text>
      <text x="736" y="152" font-size="26" font-weight="700" fill="#dda23c">12<tspan font-size="13" fill="#8aa098"> 天</tspan></text>
      <text x="736" y="174" font-size="11" fill="#8aa098">保持节奏</text>

      <rect x="946" y="90" width="216" height="98" rx="16" fill="#ffffff" stroke="#e5efea"/>
      <text x="964" y="116" font-size="12" fill="#8aa098">本月支出</text>
      <text x="964" y="152" font-size="26" font-weight="700" fill="#8a7cd2">¥2,480</text>
      <text x="964" y="174" font-size="11" fill="#8aa098">预算剩余 32%</text>
    </g>

    <!-- calendar card -->
    <rect x="262" y="206" width="500" height="458" rx="18" fill="#ffffff" stroke="#e5efea"/>
    <text x="282" y="238" font-size="15" font-weight="650" fill="#1f322c">日程</text>
    <text x="720" y="238" font-size="12.5" fill="#526960" text-anchor="end">2026年11月</text>
    <g font-size="11" fill="#8aa098" text-anchor="middle">
      <text x="295" y="268">一</text><text x="359" y="268">二</text><text x="423" y="268">三</text>
      <text x="487" y="268">四</text><text x="551" y="268">五</text><text x="615" y="268">六</text><text x="679" y="268">日</text>
    </g>
    <g font-size="12" fill="#526960" text-anchor="middle">
      <!-- week 1 -->
      <text x="295" y="300" fill="#b6c6bf">27</text><text x="359" y="300" fill="#b6c6bf">28</text>
      <text x="423" y="300" fill="#b6c6bf">29</text><text x="487" y="300" fill="#b6c6bf">30</text>
      <text x="551" y="300">1</text><text x="615" y="300">2</text><text x="679" y="300">3</text>
      <!-- week 2 -->
      <text x="295" y="358">4</text><text x="359" y="358">5</text><text x="423" y="358">6</text>
      <text x="487" y="358">7</text><text x="551" y="358">8</text><text x="615" y="358">9</text><text x="679" y="358">10</text>
      <!-- week 3 -->
      <text x="295" y="416">11</text><text x="359" y="416">12</text><text x="423" y="416">13</text>
      <text x="487" y="416">14</text><text x="551" y="416">15</text><text x="615" y="416">16</text><text x="679" y="416">17</text>
      <!-- week 4 -->
      <text x="295" y="474">18</text><text x="359" y="474">19</text><text x="423" y="474">20</text>
      <text x="487" y="474">21</text><text x="551" y="474">22</text>
      <rect x="640" y="446" width="78" height="38" rx="8" fill="#f0faf6" stroke="#79c9b4"/>
      <text x="679" y="474" fill="#247e63" font-weight="700">23</text>
      <text x="295" y="532">24</text><text x="359" y="532">25</text><text x="423" y="532">26</text>
      <text x="487" y="532">27</text><text x="551" y="532">28</text><text x="615" y="532">29</text><text x="679" y="532">30</text>
    </g>
    <g font-size="10.5">
      <rect x="461" y="348" width="54" height="17" rx="4" fill="#e4f4ee" stroke="#2f9e7d" stroke-width="0.6"/>
      <text x="488" y="360" fill="#247e63" text-anchor="middle">评审</text>
      <rect x="525" y="404" width="54" height="17" rx="4" fill="#eaf3fb" stroke="#5b95cf" stroke-width="0.6"/>
      <text x="552" y="416" fill="#3973ad" text-anchor="middle">健身</text>
      <rect x="653" y="460" width="54" height="17" rx="4" fill="#fef6e6" stroke="#dda23c" stroke-width="0.6"/>
      <text x="680" y="472" fill="#a97214" text-anchor="middle">周会</text>
    </g>

    <!-- todo card -->
    <rect x="778" y="206" width="384" height="458" rx="18" fill="#ffffff" stroke="#e5efea"/>
    <text x="798" y="238" font-size="15" font-weight="650" fill="#1f322c">待办</text>
    <rect x="1090" y="222" width="54" height="22" rx="11" fill="#e4f4ee"/>
    <text x="1117" y="237" font-size="11" fill="#247e63" text-anchor="middle">今天</text>

    <g font-size="12.5">
      <rect x="798" y="256" width="3" height="34" rx="1.5" fill="#e1685a"/>
      <rect x="810" y="265" width="19" height="19" rx="6" fill="#2f9e7d"/>
      <path d="M815 274 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="838" y="272" fill="#526960">完成模型评测报告</text>
      <text x="838" y="286" font-size="10.5" fill="#8aa098">高优先级 · 09:00</text>

      <rect x="798" y="300" width="3" height="34" rx="1.5" fill="#dda23c"/>
      <rect x="810" y="309" width="19" height="19" rx="6" fill="#ffffff" stroke="#c6d7d0" stroke-width="1.5"/>
      <text x="838" y="316" fill="#1f322c">整理数据集标注规范</text>
      <text x="838" y="330" font-size="10.5" fill="#8aa098">中优先级 · 今天</text>

      <rect x="798" y="344" width="3" height="34" rx="1.5" fill="#b9cdc5"/>
      <rect x="810" y="353" width="19" height="19" rx="6" fill="#2f9e7d"/>
      <path d="M815 362 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="838" y="360" fill="#8aa098" text-decoration="line-through">晨间复盘 15 分钟</text>
      <text x="838" y="374" font-size="10.5" fill="#8aa098">低优先级 · 已完成</text>

      <rect x="798" y="388" width="3" height="34" rx="1.5" fill="#e1685a"/>
      <rect x="810" y="397" width="19" height="19" rx="6" fill="#ffffff" stroke="#c6d7d0" stroke-width="1.5"/>
      <text x="838" y="404" fill="#1f322c">回复合作方邮件</text>
      <text x="838" y="418" font-size="10.5" fill="#8aa098">高优先级 · 18:00 截止</text>

      <rect x="798" y="432" width="3" height="34" rx="1.5" fill="#dda23c"/>
      <rect x="810" y="441" width="19" height="19" rx="6" fill="#ffffff" stroke="#c6d7d0" stroke-width="1.5"/>
      <text x="838" y="448" fill="#1f322c">阅读论文笔记</text>
      <text x="838" y="462" font-size="10.5" fill="#8aa098">中优先级 · 晚上</text>
    </g>

    <line x1="798" y1="486" x2="1142" y2="486" stroke="#e5efea"/>
    <rect x="798" y="502" width="120" height="30" rx="9" fill="#2f9e7d"/>
    <text x="858" y="521" font-size="12" fill="#ffffff" text-anchor="middle">+ 添加待办</text>
    <text x="1142" y="521" font-size="11" fill="#8aa098" text-anchor="end">本地存储 · 隐私优先</text>

    <!-- subtle footer hint -->
    <text x="262" y="686" font-size="10.5" fill="#a8bbb3">轻序 · 日程 / 待办 / 打卡 / 专注 / 记账 / 相册日记 · 支持安装到桌面与 Android</text>
  </g>
</svg>
